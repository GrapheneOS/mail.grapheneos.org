rules {
  LOCAL_FROM_NEQ_ENVFROM {
    action = "reject";
    expression = "(LOCAL_OUTBOUND | INTERNAL_MAIL) & FROM_NEQ_ENVFROM";
    message = "Sender is forged (different From: header and smtp MAIL FROM: addresses)";
  }

  LOCAL_FORGED_RECIPIENTS {
    action = "reject";
    expression = "(LOCAL_OUTBOUND | INTERNAL_MAIL) & FORGED_RECIPIENTS";
    message = "Recipients are not the same as RCPT TO: mail command";
  }

  RDNS_DNSFAIL {
    action = "soft reject";
    expression = "RDNS_DNSFAIL";
    message = "DNS failure looking up PTR record for client IP address";
    honor_action = ["reject"];
  }

  RDNS_NONE {
    action = "soft reject";
    expression = "RDNS_NONE";
    message = "Missing PTR record for client IP address";
    honor_action = ["reject"];
  }

  HFILTER_HOSTNAME_UNKNOWN {
    action = "soft reject";
    expression = "HFILTER_HOSTNAME_UNKNOWN";
    message = "Hostname from PTR record for client IP address has a different IP address";
    honor_action = ["reject"];
  }

  HFILTER_HELO_BAREIP {
    action = "reject";
    expression = "HFILTER_HELO_BAREIP";
    message = "HELO must be a domain, not an address literal";
  }

  HFILTER_HELO_NOT_FQDN {
    action = "reject";
    expression = "HFILTER_HELO_NOT_FQDN";
    message = "HELO domain must be a valid FQDN";
  }

  HFILTER_HELO_NORES_A_OR_MX {
    action = "soft reject";
    expression = "HFILTER_HELO_NORES_A_OR_MX";
    message = "HELO domain does not have any MX, A or AAAA record";
    honor_action = ["reject"];
  }

  HFILTER_HELO_NORESOLVE_MX {
    action = "soft reject";
    expression = "HFILTER_HELO_NORESOLVE_MX";
    message = "HELO domain has one or more MX records but none resolves to an IP";
    honor_action = ["reject"];
  }

  HFILTER_FROMHOST_NOT_FQDN {
    action = "reject";
    expression = "HFILTER_FROMHOST_NOT_FQDN";
    message = "Return address (SMTP MAIL FROM:) domain must be a valid FQDN";
  }

  HFILTER_FROMHOST_NORES_A_OR_MX {
    action = "soft reject";
    expression = "HFILTER_FROMHOST_NORES_A_OR_MX";
    message = "Return address (SMTP MAIL FROM:) domain does not have any MX, A or AAAA record";
    honor_action = ["reject"];
  }

  HFILTER_FROMHOST_NORESOLVE_MX {
    action = "soft reject";
    expression = "HFILTER_FROMHOST_NORESOLVE_MX";
    message = "Return address (SMTP MAIL FROM:) domain has one of more MX records but none resolves to an IP";
    honor_action = ["reject"];
  }

  MX_DNS_FAIL {
    action = "soft reject";
    expression = "MX_DNS_FAIL";
    message = "DNS failure checking mail server for return address (SMTP MAIL FROM:) domain";
    honor_action = ["reject"];
  }
  MIME_FROM_MX_DNS_FAIL {
    action = "soft reject";
    expression = "MIME_FROM_MX_DNS_FAIL";
    message = "DNS failure checking mail server for From header domain";
    honor_action = ["reject"];
  }
  REPLYTO_MX_DNS_FAIL {
    action = "soft reject";
    expression = "REPLYTO_MX_DNS_FAIL";
    message = "DNS failure checking mail server for Reply-To header domain";
    honor_action = ["reject"];
  }

  MX_NONE {
    action = "soft reject";
    expression = "MX_NONE";
    message = "Return address (SMTP MAIL FROM:) domain does not have any MX, A or AAAA record";
    honor_action = ["reject"];
  }

  MX_BROKEN {
    action = "soft reject";
    expression = "MX_BROKEN";
    message = "Return address (SMTP MAIL FROM:) domain has one of more MX records but none resolves to an IP";
    honor_action = ["reject"];
  }

  MX_BAD {
    action = "reject";
    expression = "MX_BAD";
    message = "Return address (SMTP MAIL FROM:) domain mail server has a blocked MX domain";
  }
  MIME_FROM_MX_BAD {
    action = "reject";
    expression = "MIME_FROM_MX_BAD";
    message = "From header domain mail server has a blocked MX domain";
  }
  REPLYTO_MX_BAD {
    action = "reject";
    expression = "REPLYTO_MX_BAD";
    message = "Reply-To header domain mail server has a blocked MX domain";
  }

  MX_LOCAL_ONLY {
    action = "soft reject";
    expression = "MX_LOCAL_ONLY";
    message = "Return address (SMTP MAIL FROM:) domain only has mail server IPs in private ranges";
    honor_action = ["reject"];
  }

  MX_BOGON_ONLY {
    action = "soft reject";
    expression = "MX_BOGON_ONLY";
    message = "Return address (SMTP MAIL FROM:) domain only has mail server IPs in non-routable ranges";
    honor_action = ["reject"];
  }

  MX_IP_BAD {
    action = "reject";
    expression = "MX_IP_BAD";
    message = "Return address (SMTP MAIL FROM:) domain mail server has a blocked IP address";
  }
  MIME_FROM_MX_IP_BAD {
    action = "reject";
    expression = "MIME_FROM_MX_IP_BAD";
    message = "From header domain mail server has a blocked IP address";
  }
  REPLYTO_MX_IP_BAD {
    action = "reject";
    expression = "REPLYTO_MX_IP_BAD";
    message = "Reply-To header domain mail server has a blocked IP address";
  }

  MX_REFUSED {
    action = "soft reject";
    expression = "MX_REFUSED";
    message = "Return address (SMTP MAIL FROM:) domain mail server rejected connection (TCP RST)";
    honor_action = ["reject"];
  }

  MX_A_REFUSED {
    action = "soft reject";
    expression = "MX_A_REFUSED";
    message = "Return address (SMTP MAIL FROM:) domain lacks an MX record and the fallback mail server rejected connection (TCP RST)";
    honor_action = ["reject"];
  }

  MX_TIMEOUT_CONNECT {
    action = "soft reject";
    expression = "MX_TIMEOUT_CONNECT";
    message = "Return address (SMTP MAIL FROM:) domain mail server did not respond to connection attempt";
    honor_action = ["reject"];
  }

  MX_A_TIMEOUT_CONNECT {
    action = "soft reject";
    expression = "MX_A_TIMEOUT_CONNECT";
    message = "Return address (SMTP MAIL FROM:) domain lacks an MX record and the fallback mail server did not respond to connection attempt";
    honor_action = ["reject"];
  }

  MX_INVALID {
    action = "soft reject";
    expression = "MX_INVALID";
    message = "Return address (SMTP MAIL FROM:) domain mail server does not speak SMTP";
    honor_action = ["reject"];
  }

  MX_A_INVALID {
    action = "soft reject";
    expression = "MX_A_INVALID";
    message = "Return address (SMTP MAIL FROM:) domain lacks an MX record and the fallback mail server does not speak SMTP";
    honor_action = ["reject"];
  }

  R_DKIM_TEMPFAIL {
    action = "soft reject";
    expression = "R_DKIM_TEMPFAIL";
    message = "DKIM TEMPFAIL";
    require_action = ["reject", "quarantine"];
  }

  DMARC_DNSFAIL {
    action = "soft reject";
    expression = "DMARC_DNSFAIL";
    message = "DMARC temperror";
  }

  SPF_FAIL_WITHOUT_DMARC_POLICY_ALLOW {
    action = "reject";
    expression = "R_SPF_FAIL & !DMARC_POLICY_ALLOW";
    message = "SPF fail";
  }

  SPF_SOFTFAIL_WITHOUT_DMARC_POLICY_ALLOW {
    action = "add header";
    expression = "SPF_SOFTFAIL_WITHOUT_DMARC_POLICY_ALLOW";
    require_action = ["no action"];
  }

  SPF_DNSFAIL {
    action = "soft reject";
    expression = "R_SPF_DNSFAIL";
    message = "SPF temperror";
  }

  SPF_PERMFAIL {
    action = "reject";
    expression = "R_SPF_PERMFAIL";
    message = "SPF permerror";
  }

  ENVFROM_INVALID {
    action = "reject";
    expression = "ENVFROM_INVALID";
    message = "Return address (SMTP MAIL FROM:) has an invalid format";
  }

  FROM_INVALID {
    action = "reject";
    expression = "FROM_INVALID";
    message = "From header has an invalid format";
  }

  REPLYTO_INVALID {
    action = "reject";
    expression = "REPLYTO_INVALID";
    message = "Reply-To header has an invalid format";
  }

  MISSING_DATE {
    action = "reject";
    expression = "MISSING_DATE";
    message = "Missing Date: header required by RFC 5322";
  }

  INVALID_DATE {
    action = "reject";
    expression = "INVALID_DATE";
    message = "Invalid Date: header not using RFC 5322 format";
  }

  BOUNCE_RBL_SPAMHAUS_ZEN {
    action = "reject";
    expression = "BOUNCE & (RBL_SPAMHAUS_SBL | RBL_SPAMHAUS_CSS | RBL_SPAMHAUS_XBL | RBL_SPAMHAUS_PBL | RBL_SPAMHAUS_DROP)";
    message = "Bounce message from client IP listed in Spamhaus ZEN";
  }

  # Omits HEURISTIC, POLICY_GENERIC and POLICY_MISSING
  BOUNCE_RBL_ABUSIX {
    action = "reject";
    expression = "BOUNCE & (RBL_ABUSIX_SPAM | RBL_ABUSIX_SPAM_MANUAL | RBL_ABUSIX_EXPLOIT)";
    message = "Bounce message from client IP listed in Abusix Combined Blocklist";
  }

  BOUNCE_RBL_SEM_BACKSCATTER {
    action = "reject";
    expression = "BOUNCE & RBL_SEM_BACKSCATTER";
    message = "Bounce message from client IP listed in Spam Eating Monkey backscatter RBL (SEM-BACKSCATTER)";
  }
}
