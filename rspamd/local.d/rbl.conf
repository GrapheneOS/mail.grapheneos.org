rbls {
  senderscore {
    enabled = true;
  }

  senderscore_reputation {
    enabled = true;
    disable_monitoring = true;
  }

  RSPAMD_EMAILBL {
    # disable checks based on message content
    exclude_checks = ["emails"];
  }

  MSBL_EBL {
    # disable checks based on message content
    exclude_checks = ["emails"];
  }

  SURBL_MULTI {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  URIBL_MULTI {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  RSPAMD_URIBL {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  DBL {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  SEM_URIBL_UNKNOWN {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  SEM_URIBL_FRESH15_UNKNOWN {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  abusix {
    symbol = "ABUSIX";
    rbl = "{= env.ABUSIX_API_KEY =}.combined.mail.abusix.zone";
    checks = ["from", "received"];
    symbols_prefixes = {
      received = "RECEIVED",
      from = "RBL",
    }
    returncodes {
      ABUSIX_SPAM = "127.0.0.2";
      ABUSIX_SPAM_HEURISTIC = "127.0.0.3";
      ABUSIX_SPAM_MANUAL = "127.0.0.200";
      ABUSIX_EXPLOIT = "127.0.0.4";
      ABUSIX_POLICY_GENERIC = "127.0.0.11";
      ABUSIX_POLICY_MISSING = "127.0.0.12";
    }
  }

  spamcop {
    symbol = "SPAMCOP";
    rbl = "bl.spamcop.net";
    checks = ["from", "received"];
    symbols_prefixes = {
      received = "RECEIVED",
      from = "RBL",
    }
  }

  barracuda {
    symbol = "BARRACUDA";
    rbl = "b.barracudacentral.org";
    checks = ["from", "received"];
    symbols_prefixes = {
      received = "RECEIVED",
      from = "RBL",
    }
  }

  fabel {
    symbol = "FABEL";
    rbl = "spamsources.fabel.dk";
    checks = ["from", "received"];
    symbols_prefixes = {
      received = "RECEIVED",
      from = "RBL",
    }
  }

  dronebl {
    symbol = "DRONEBL";
    rbl = "dnsbl.dronebl.org";
    checks = ["from", "received"];
    symbols_prefixes = {
      received = "RECEIVED",
      from = "RBL",
    }
  }

  efnet {
    symbol = "EFNET";
    rbl = "rbl.efnetrbl.org";
    checks = ["from", "received"];
    symbols_prefixes = {
      received = "RECEIVED",
      from = "RBL",
    }
  }

  ABUSIX_EMAILBL {
    rbl = "{= env.ABUSIX_API_KEY =}.emailbl.mail-beta.abusix.zone";
    checks = ["emails", "replyto"];
    # disable checks based on message content
    exclude_checks = ["emails"];
    hash = "sha1";
    ignore_whitelist = true;
    ignore_url_whitelist = true;
    selector = {
      from_smtp = "from('smtp'):addr.lower_utf8";
      from_mime = "from('mime'):addr.lower_utf8";
    }
  }

  ABUSIX_DOMAIN {
    rbl = "{= env.ABUSIX_API_KEY =}.dblack.mail.abusix.zone";
    checks = ["emails", "dkim", "helo", "rdns", "replyto", "urls", "content_urls"];
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
    emails_domainonly = true;
    selector = {
      from_smtp = "from('smtp'):domain";
      from_mime = "from('mime'):domain";
      mid = "header(Message-Id).regexp('@([^\.]+\.[^>]+)').last";
    }
  }

  ABUSIX_BITCOIN {
    rbl = "{= env.ABUSIX_API_KEY =}.btc-wallets.mail-beta.abusix.zone";
    selector = "symbol('BITCOIN_ADDR'):options.digest(hex, sha1)";
  }
}
