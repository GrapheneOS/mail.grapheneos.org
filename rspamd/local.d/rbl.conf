rbls {
  mailspike {
    ipv6 = false;
  }

  sem {
    enabled = false;
  }

  semIPv6 {
    enabled = false;
  }

  dnswl {
    whitelist_exception = [
      "RCVD_IN_DNSWL",
      "DNSWL_BLOCKED",
    ];
  }

  virusfree {
    enabled = false;
  }

  RSPAMD_EMAILBL {
    # disable checks based on message content
    exclude_checks = ["emails"];
  }

  MSBL_EBL {
    # disable checks based on message content
    exclude_checks = ["emails"];
  }

  SURBL_MULTI {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  SURBL_HASHBL {
    # disable checks based on message content
    enabled = false;
  }

  URIBL_MULTI {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  RSPAMD_URIBL {
    checks = ["replyto"];
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
  }

  DBL {
    # disable checks based on message content
    exclude_checks = ["emails", "urls", "content_urls"];
