BLOCKLIST_ESLD_ENVFROM {
  type = "from";
  filter = "email:domain:tld";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_esld.map";
  action = "reject";
  message = "Return address (SMTP MAIL FROM:) domain identified as spam source";
}

BLOCKLIST_ESLD_FROM {
  type = "header";
  header = "From";
  filter = "email:domain:tld";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_esld.map";
  action = "reject";
  message = "From address domain identified as spam source";
}

