}

SPAM_ESLD_URL {
  type = "url";
  filter = "tld";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_esld.map";
  score = 4.0;
  one_shot = true;
}

BLOCKLIST_ADDR_ENVFROM {
