BLOCKLIST_ADDR_MDN {
  type = "header";
  header = "Disposition-Notification-To";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "Disposition-Notification-To address identified as spam source";
}

BLOCKLIST_SUBJECT_TEXT {
  type = "header";
  header = "Subject";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_text.map";
  regexp = true;
  action = "reject";
  message = "Text in Subject identified as spam";
}

SPAM_SUBJECT_TEXT {
  type = "header";
  header = "Subject";
  map = "$LOCAL_CONFDIR/local.d/maps.d/spam_text.map";
  regexp = true;
  score = 8.0;
}

BLOCKLIST_BODY_TEXT {
  type = "content";
  filter = "text";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_text.map";
  regexp = true;
  action = "reject";
  message = "Text in body identified as spam";
}

SPAM_BODY_TEXT {
  type = "content";
  filter = "text";
  map = "$LOCAL_CONFDIR/local.d/maps.d/spam_text.map";
  regexp = true;
  score = 8.0;
}

NONEMPTY_BODY_TEXT {
  type = "content";
  filter = "text";
  map = "$LOCAL_CONFDIR/local.d/maps.d/nonempty_text.map";
  regexp = true;
}

BLOCKLIST_IP {
  type = "ip";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_ip.map";
  action = "reject";
  message = "IP address identified as spam source";
}

TOR_EXIT {
  type = "ip";
  map = "$LOCAL_CONFDIR/local.d/maps.d/tor_exit.map";
  action = "reject";
  message = "IP address identified as Tor exit";
}

BACKSCATTER_IP {
  type = "ip";
  map = "$LOCAL_CONFDIR/local.d/maps.d/backscatter_ip.map";
}

DMARC_UPGRADE {
  require_symbols = "DMARC_NA | DMARC_BAD_POLICY | DMARC_POLICY_SOFTFAIL";
  type = "header";
  header = "From";
  filter = "email:domain:tld";
  map = "$LOCAL_CONFDIR/local.d/maps.d/dmarc_upgrade.map";
  score = 4.0;
}

HELO_IP_MISMATCH_ALLOWLIST {
  require_symbols = "HFILTER_HELO_IP_A";
  type = "hostname";
  map = "$LOCAL_CONFDIR/local.d/maps.d/helo_ip_mismatch_hostname_allowlist.map";
  glob = true;
  score = -0.01;
}

GOOD_ESLD {
  require_symbols = "DMARC_POLICY_ALLOW";
  type = "header";
  header = "From";
  filter = "email:domain:tld";
  map = "$LOCAL_CONFDIR/local.d/maps.d/good_esld.map";
  score = -1.0;
}

GOOD_FROM {
  require_symbols = "DMARC_POLICY_ALLOW";
  type = "header";
  header = "From";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/good_addr.map";
  score = -1.0;
}

BUGREPORT_ZIP {
  type = "filename";
  map = "$LOCAL_CONFDIR/local.d/maps.d/bugreport_zip.map";
  regexp = true;
  score = -4.0;
  one_shot = true;
}

LOGS {
  type = "header";
  header = "To";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/logs_addr.map";
}
