  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "Return address (SMTP MAIL FROM:) identified as spam source";
}

BLOCKLIST_ADDR_FROM {
  type = "header";
  header = "From";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "From address identified as spam source";
}

BLOCKLIST_ADDR_ENVRCPT {
  type = "rcpt";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "Recipient address (SMTP RCPT TO:) identified as spam source";
}

BLOCKLIST_ADDR_TO {
  type = "header";
  header = "To";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "To address identified as spam source";
}

BLOCKLIST_ADDR_CC {
  type = "header";
  header = "Cc";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "Cc address identified as spam source";
}

BLOCKLIST_ADDR_REPLYTO {
  type = "header";
  header = "Reply-To";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/blocklist_addr.map";
  action = "reject";
  message = "Reply-To address identified as spam source";
